<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alireza Kiani | Portfolio & Systems</title>
    <script>
      // Redirect direct path visits (e.g. /portfolio) to HashRouter URLs (/#/portfolio)
      (function() {
        var l = window.location;
        var cleanPath = l.pathname && l.pathname !== '/' ? l.pathname : '/';
        var targetHash = l.hash && l.hash.length > 1 ? l.hash : ('#' + cleanPath + (l.search || ''));
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + targetHash
        );
      })();
    </script>
  </head>
  <body>
  </body>
</html>
